<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#1b2430;--mu:#667085;--bd:#e4e7ec;--sb:#f0f3f6;--ac:#0f6b5c;--g:#12803c;--gb:#e3f4e9;--w:#a15c07;--wb:#fdf1d8;--b:#b42318;--bb:#fde7e5;--c1:#0f6b5c;--c2:#e08a1e;--c3:#8a94a6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--cd:#171e27;--tx:#e6e9ee;--mu:#97a1b0;--bd:#2a3340;--sb:#1e2733;--ac:#3ec1a8;--g:#4cc56f;--gb:#12301c;--w:#e7b04d;--wb:#3a2c0c;--b:#f08a80;--bb:#3b1713;--c1:#3ec1a8;--c2:#f0a845;--c3:#7d889a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1419;--cd:#171e27;--tx:#e6e9ee;--mu:#97a1b0;--bd:#2a3340;--sb:#1e2733;--ac:#3ec1a8;--g:#4cc56f;--gb:#12301c;--w:#e7b04d;--wb:#3a2c0c;--b:#f08a80;--bb:#3b1713;--c1:#3ec1a8;--c2:#f0a845;--c3:#7d889a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:10}
header{background:var(--cd);padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:18px;margin:0}#pr{color:var(--mu);font-weight:600}
#up{background:var(--cd);padding:0 16px 14px;border-bottom:1px solid var(--bd)}
.dz{display:block;border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;cursor:pointer}
.dz:hover{border-color:var(--ac)}.dz b{display:block;font-size:16px;color:var(--ac)}.dz span{color:var(--mu)}
.mini .dz{padding:8px;display:inline-block}.mini .dz span{display:none}.mini .dz b{font-size:13px}
#st{display:inline-block;margin:8px 0 0 8px;color:var(--mu)}

<header><h1>Dashboard Kinerja Bulanan</h1><div id="pr"></div></header>
<section id="up"><label class="dz" for="fi"><b>Upload file Excel laporan kinerja</b><span>Klik di sini atau seret file .xlsx ke halaman ini. File dibaca di browser Anda dan tidak dikirim ke server mana pun.</span></label><input id="fi" type="file" accept=".xlsx,.xlsm,.xls" hidden><span id="st"></span></section>
<nav id="tabs"></nav><main id="view"><div class="em">Belum ada data. Upload file laporan kinerja (.xlsx) di atas, dashboard akan tampil otomatis.</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script>
const M=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const $=s=>document.querySelector(s);
let S={},mode='m',tab=0,CH=[],PO=[],P='';
const isN=v=>typeof v==='number'&&isFinite(v);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ff=v=>isN(v)?Math.round(v).toLocaleString('id-ID'):'-';
const fj=v=>isN(v)?(v/1e6).toLocaleString('id-ID',{maximumFractionDigits:0}):'-';
const rp=v=>{if(!isN(v))return'-';const a=Math.abs(v),z=x=>x.toFixed(2).replace('.',',');return(v<0?'-':'')+'Rp '+(a>=1e12?z(a/1e12)+' T':a>=1e9?z(a/1e9)+' M':a>=1e6?(a/1e6).toFixed(1).replace('.',',')+' jt':ff(a))};
const pc=(v,d)=>isN(v)?v.toFixed(d==null?1:d).replace('.',',')+'%':'-';
const bd=(v,c)=>{if(!isN(v))return'<span class="bg">-</span>';const k=c?(v<=100?'g':v<=110?'w':'b'):(v>=100?'g':v>=85?'w':'b');return`<span class="bg ${k}">${pc(v)}</span>`};
const lab=r=>String(r.find(x=>typeof x==='string'&&x.trim())||'').trim();
const T=(r,i)=>String((r&&r[i])||'').trim();
const nod=n=>`<div class="em">Sheet ${n} tidak ditemukan atau strukturnya berbeda di file ini.</div>`;
const kc=(t,v,s)=>`<div class="k"><div class="kt">${t}</div><div class="kv">${v}</div><div class="kr">${s}</div></div>`;
const cv=id=>`<div class="cv"><canvas id="${id}"></canvas></div>`;
const seg=()=>`<div class="seg"><button data-m="m" class="${mode=='m'?'on':''}">Bulan ini</button><button data-m="s" class="${mode=='s'?'on':''}">s.d. bulan ini</button></div>`;
const tbl=(h,b,c)=>`<div class="tw"><table class="${c||'nt'}"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${b}</tbody></table></div>`;
const dl=x=>x>0?`<span class="up">▲ ${ff(x)}</span>`:x<0?`<span class="dn">▼ ${ff(-x)}</span>`:'-';
const cs=()=>{const g=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();return[g('--c1'),g('--c2'),g('--c3'),g('--b'),g('--w'),'#9b6bd1','#2b8cbe']};
const ch=(id,cfg)=>{const e=document.getElementById(id);if(e&&window.Chart)CH.push(new Chart(e,cfg))};
const bar=(id,lb,ds,o)=>{o=o||{};const c=cs();ch(id,{type:o.t||'bar',data:{labels:lb,datasets:ds.map((d,i)=>({label:d[0],data:d[1],backgroundColor:c[i],borderColor:c[i],tension:.3,...(o.line===i?{type:'line'}:{})}))},options:{indexAxis:o.x,responsive:true,maintainAspectRatio:false,layout:{padding:{top:20,right:o.x?40:12}},plugins:{legend:{display:ds.length>1},datalabels:{color:o.st?'#fff':window.TX,anchor:o.st?'center':'end',align:o.st?'center':'end',clip:false,font:{size:11,weight:'600'},formatter:nf,display:c=>{const v=c.dataset.data[c.dataIndex];return isN(v)&&(o.st?Math.abs(v)>=0.5:v!==0)}}},scales:o.st?{x:{stacked:true},y:{stacked:true}}:{}}})};
const dn=(id,lb,d)=>ch(id,{type:'doughnut',data:{labels:lb,datasets:[{data:d,backgroundColor:cs(),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'},datalabels:{color:'#fff',font:{size:11,weight:'700'},formatter:(v,c)=>nf(v)+' ('+(v/c.dataset.data.reduce((a,b)=>a+b,0)*100).toFixed(0)+'%)',display:c=>{const d=c.dataset.data;return d[c.dataIndex]/d.reduce((a,b)=>a+b,0)>=0.05}}}}});
const nar=(t,s)=>{const re=/sebesar Rp\. ([\d.]+) atau (\d+)% dari anggaran sebesar Rp\. ([\d.]+) dan (\d+)% dari realisasi tahun lalu sebesar Rp\. ([\d.]+)/g,m=[...s.matchAll(re)];if(m.length<2)return`<div class="nc"><h4>${esc(t)}</h4><p>${hl(s)}</p></div>`;
 const co=/BIAYA/i.test(t),n=x=>+x.replace(/\./g,'');
 const blk=(l,x)=>{const a=n(x[3]),r=n(x[1]),y=n(x[5]),mx=Math.max(a,r,y)||1,row=(k,v,c)=>`<div class="br"><span>${k}</span><div class="pb"><i style="width:${v/mx*100}%;background:${c}"></i></div><b>${rp(v)}</b></div>`;
  return`<div class="nb"><div class="kt">${l}</div><div class="kv">${rp(r)}</div>${row('Anggaran',a,'var(--c3)')}${row('Realisasi',r,'var(--c1)')}${row('Thn lalu',y,'var(--c2)')}<div class="kr"><span>dari anggaran</span>${bd(+x[2],co)}</div><div class="kr"><span>dari tahun lalu</span>${bd(+x[4],co)}</div></div>`};
 return`<div class="nc"><h4>${esc(t)}</h4><div class="nw">${blk('Bulan ini',m[0])}${blk('s.d. bulan ini',m[1])}</div></div>`};
const nf=v=>isN(v)?(Math.abs(v)>=100?Math.round(v).toLocaleString('id-ID'):v.toLocaleString('id-ID',{maximumFractionDigits:2})):'';
const hl=s=>esc(s).replace(/(Rp\. [\d.]+)/g,'<b>$1</b>').replace(/(\d+%)/g,'<b>$1</b>');

function load(buf){const wb=XLSX.read(buf,{type:'array'});S={};
 const k={ik:/ikhtisar/i,lr:/^lr$/i,kt:/kontrak/i,tk:/^tk$/i,cf:/^cf$/i,ar:/^ar$/i,ab:/^ab$/i,nc:/^nc$/i,rs:/^rs$/i};
 wb.SheetNames.forEach(n=>{for(const x in k)if(k[x].test(n.trim())){const w=wb.Sheets[n];if(!w['!ref'])continue;const g=XLSX.utils.decode_range(w['!ref']);g.s.c=0;g.s.r=0;S[x]=XLSX.utils.sheet_to_json(w,{header:1,range:g,raw:true,defval:null,blankrows:true})}})}

const lrRow=re=>(S.lr||[]).find(r=>typeof r[0]==='string'&&re.test(r[0].trim()));
const pick=(r,m)=>{if(!r)return{};const o=m==='m'?2:7;return{rk:r[o],re:r[o+1],ly:r[o+2],p:r[o+3],pl:r[o+4]}};
const KP=[['Pendapatan',/^TOTAL PENDAPATAN/i],['Beban Pokok Pendapatan',/^TOTAL BEBAN POKOK/i,1],['Laba Kotor',/^LABA KOTOR/i],['Biaya Adm. & Umum',/^BIAYA ADMINISTRASI/i,1],['Laba Usaha',/^LABA USAHA/i],['Laba Setelah Pajak',/^LABA SETELAH PAJAK/i],['EBITDA',/^EBITDA$/i]];

function vRing(){if(!S.lr)return nod('LR');let k='';const lb=[],a=[],b=[],c=[];
 KP.forEach(([t,re,co])=>{const o=pick(lrRow(re),mode);if(!isN(o.re))return;lb.push(t);a.push(o.rk/1e9);b.push(o.re/1e9);c.push(o.ly/1e9);
  k+=`<div class="k"><div class="kt">${t}</div><div class="kv">${rp(o.re)}</div><div class="pb"><i style="width:${Math.min(o.p||0,100)}%"></i></div><div class="kr"><span>vs RKAP ${rp(o.rk)}</span>${bd(o.p,co)}</div><div class="kr"><span>vs tahun lalu ${rp(o.ly)}</span>${bd(o.pl,co)}</div></div>`});
 let n='',t=null;(S.ik||[]).forEach(r=>{const s=typeof r[2]==='string'?r[2].trim():'';if(!s)return;if(/^Realisasi/.test(s)&&t){n+=nar(t,s);t=null}else if(s===s.toUpperCase()&&s.length<40&&!/^BULAN|^PT/.test(s))t=s});
 PO.push(()=>bar('c1',lb,[['RKAP',a],['Realisasi',b],['Tahun lalu',c]]));
 return seg()+`<div class="kg">${k}</div><div class="cd"><h3>RKAP vs Realisasi vs Tahun Lalu (Rp miliar)</h3>${cv('c1')}</div>`+(n?`<h3 class="sh">Ikhtisar Kinerja: Anggaran vs Realisasi vs Tahun Lalu</h3><div class="ng">${n}</div>`:'')}

function segRows(R,st){const i=R.findIndex(r=>T(r,0)===st),o=[];if(i<0)return o;for(let j=i+1;j<R.length&&!/^TOTAL/i.test(T(R[j],0));j++)if(isN(R[j][1]))o.push(R[j]);return o}
function vLR(){const R=S.lr;if(!R)return nod('LR');const o=mode==='m'?2:7;let h='';
 R.forEach((r,i)=>{if(i<5)return;const l=T(r,0);if(!l)return;const v=[r[o],r[o+1],r[o+2]],has=v.some(isN),mg=/margin/i.test(l),z=!v[0]&&!v[1],co=/BEBAN|BIAYA/i.test(l);
  const f=x=>!isN(x)?'':mg?pc(x*100):ff(x),sh=has&&!mg&&!z;
  h+=`<tr class="${has?(/^[A-Z0-9 &().-]+$/.test(l)&&l.length>3?'tt':''):'hd'}"><td>${esc(l)}</td><td>${f(v[0])}</td><td>${f(v[1])}</td><td>${f(v[2])}</td><td>${sh?bd(r[o+3],co):''}</td><td>${sh?bd(r[o+4],co):''}</td></tr>`});
 const pd=segRows(R,'PENDAPATAN'),bb=segRows(R,'BEBAN POKOK PENDAPATAN'),nm=x=>x.map(r=>T(r,0).replace('Jasa ',''));
 PO.push(()=>{bar('c1',nm(pd),[['RKAP',pd.map(r=>r[o]/1e9)],['Realisasi',pd.map(r=>r[o+1]/1e9)],['Tahun lalu',pd.map(r=>r[o+2]/1e9)]]);dn('c2',nm(pd),pd.map(r=>r[o+1]/1e9));bar('c3',nm(bb),[['RKAP',bb.map(r=>r[o]/1e9)],['Realisasi',bb.map(r=>r[o+1]/1e9)],['Tahun lalu',bb.map(r=>r[o+2]/1e9)]])});
 return seg()+`<div class="g2"><div class="cd"><h3>Pendapatan per jasa (Rp miliar)</h3>${cv('c1')}</div><div class="cd"><h3>Komposisi pendapatan realisasi</h3>${cv('c2')}</div></div><div class="cd" style="margin-bottom:16px"><h3>Beban pokok per jasa (Rp miliar)</h3>${cv('c3')}</div>`+tbl(['Uraian (Rp)','RKAP','Realisasi','Tahun lalu','% RKAP','% thn lalu'],h)}

function blocks(){const R=S.kt||[],b=[];R.forEach((r,i)=>{if(typeof r[0]==='string'&&typeof r[1]==='string'&&/^S\.?\s?D/i.test(String(r[6]||'')))b.push({n:r[0].trim(),i})});b.forEach((x,k)=>x.e=k+1<b.length?b[k+1].i:R.length);return b}
const bf=(R,x,re)=>R.slice(x.i,x.e).find(r=>re.test(T(r,0)));
function vKt(){const R=S.kt;if(!R)return nod('LR KONTRAK');const bl=blocks(),o=mode==='m'?1:6;if(!bl.length)return nod('LR KONTRAK');
 const rows=bl.map(x=>{const g=re=>{const r=bf(R,x,re);return r?{rk:r[o],re:r[o+1],p:r[o+3]}:{}},t=bf(R,x,/^TOTAL TENAGA/i);return{n:x.n,vl:g(/^Volume/i),pd:g(/^Pendapatan$/i),bb:g(/^TOTAL BEBAN/i),lb:g(/^LABA/i),tk:t?t[2]:null}}).sort((a,b)=>(b.pd.re||0)-(a.pd.re||0));
 const top=rows.slice(0,12);
 PO.push(()=>{bar('c1',top.map(r=>r.n),[['Pendapatan',top.map(r=>(r.pd.re||0)/1e9)],['Laba operasi',top.map(r=>(r.lb.re||0)/1e9)]],{x:'y'});
  $('#ks').onchange=det;det()});
 window.det=function(){const x=bl[$('#ks').value];let h='';R.slice(x.i+5,x.e).forEach(r=>{const l=T(r,0);if(!l)return;const v=[1,2,3,4,6,7,8,9].map(i=>r[i]);if(!v.some(isN)){h+=`<tr class="hd"><td colspan="9">${esc(l)}</td></tr>`;return}const mg=/margin/i.test(l);
  h+=`<tr class="${/^[A-Z( )&]+$/.test(l)?'tt':''}"><td>${esc(l)}</td>${v.map((a,i)=>`<td>${!isN(a)?'':mg?pc(a*100):(i==3||i==7)?pc(a):ff(a)}</td>`).join('')}</tr>`});
  $('#det').innerHTML=tbl(['Uraian','Bln RKAP','Bln Real','Bln Thn lalu','Bln %','s.d. RKAP','s.d. Real','s.d. Thn lalu','s.d. %'],h)};
 return seg()+`<div class="cd" style="margin-bottom:16px"><h3>12 kontrak terbesar: pendapatan dan laba operasi realisasi (Rp miliar)</h3><div class="cv" style="height:420px"><canvas id="c1"></canvas></div></div>`
 +tbl(['Kontrak','Volume','Pendapatan (Rp)','% RKAP','Beban Pokok (Rp)','Laba Operasi (Rp)','% RKAP','TK'],rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${ff(r.vl.re)}</td><td>${ff(r.pd.re)}</td><td>${bd(r.pd.p)}</td><td>${ff(r.bb.re)}</td><td class="${r.lb.re<0?'neg':''}">${ff(r.lb.re)}</td><td>${bd(r.lb.p)}</td><td>${ff(r.tk)}</td></tr>`).join(''))
 +`<h3 class="sh">Detail laba rugi per kontrak</h3><div class="fl"><select id="ks">${bl.map((x,i)=>`<option value="${i}">${esc(x.n)}</option>`).join('')}</select></div><div id="det"></div>`}

function vTK(){const R=S.tk;if(!R)return nod('TK');
 const d=R.filter(r=>isN(r[0])&&typeof r[1]==='string'&&r.slice(2).some(isN));
 const lr=n=>R.filter(r=>lab(r)===n).pop(),vl=r=>r?r.filter(isN):[];
 const tt=vl(lr('Total'));while(tt.length&&!tt[tt.length-1])tt.pop();const n=tt.length;if(!n)return nod('TK (ringkasan)');
 const pt=vl(lr('PKWTT')).slice(0,n),pk=vl(lr('PKWT')).slice(0,n),L=n-1,col=(r,m,k)=>(r[2+2*m+k]||0);
 const rows=d.map(r=>({n:r[1],a:col(r,L,0),b:col(r,L,1),p:L>0?col(r,L-1,0)+col(r,L-1,1):0})).map(r=>({...r,t:r.a+r.b})).filter(r=>r.t>0||r.p>0).sort((a,b)=>b.t-a.t);
 PO.push(()=>{bar('c1',M.slice(0,n),[['PKWTT',pt],['PKWT',pk],['Total',tt]],{t:'line'});const t=rows.slice(0,10);bar('c2',t.map(r=>r.n.slice(0,28)),[['PKWTT',t.map(r=>r.a)],['PKWT',t.map(r=>r.b)]],{x:'y',st:1})});
 const pv=x=>L>0?` <span class="kr">${dl(x[L]-x[L-1])} vs bln lalu</span>`:'';
 return `<div class="kg">${kc('Total tenaga kerja',ff(tt[L]),dl(tt[L]-(tt[L-1]||tt[L]))+' vs bulan lalu')}${kc('TK Tetap (PKWTT)',ff(pt[L]),dl(pt[L]-(pt[L-1]||pt[L]))+' vs bulan lalu')}${kc('TK Tidak Tetap (PKWT)',ff(pk[L]),dl(pk[L]-(pk[L-1]||pk[L]))+' vs bulan lalu')}${kc('Kontrak aktif',ff(rows.filter(r=>r.t>0).length),'dengan TK bulan ini')}</div>`
 +`<div class="g2"><div class="cd"><h3>Tren tenaga kerja ${M[0]}–${M[L]}</h3>${cv('c1')}</div><div class="cd"><h3>10 kontrak dengan TK terbanyak (${M[L]})</h3>${cv('c2')}</div></div>`
 +tbl(['Kontrak','PKWTT','PKWT','Total','Selisih vs bln lalu'],rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${ff(r.a)}</td><td>${ff(r.b)}</td><td><b>${ff(r.t)}</b></td><td>${dl(r.t-r.p)}</td></tr>`).join(''))}

function vCF(){const R=S.cf;if(!R)return nod('CF');const hi=R.findIndex(r=>/^u\s*r\s*a\s*i\s*a\s*n/i.test(T(r,2)));if(hi<0)return nod('CF');
 const H=R[hi];let ti=H.findIndex((x,i)=>i>3&&/total/i.test(String(x||'')));if(ti<0)ti=H.length-1;
 const nm=r=>T(r,3)||T(r,2),hasN=(r,c)=>c.some(i=>isN(r[i]));let cols=[];for(let i=4;i<ti;i++)cols.push(i);
 const find=re=>R.find((r,i)=>i>hi&&re.test(nm(r))&&hasN(r,cols)),kas=find(/^KAS DAN SETARA KAS AKHIR/i);
 let la=cols.length-1;if(kas)while(la>0&&!kas[cols[la]])la--;cols=cols.slice(0,la+1);
 const ops=find(/^ARUS KAS DARI AKTIVITAS OPERASI/i),inv=find(/^ARUS KAS UNTUK AKTIVITAS INVESTASI/i),fin=find(/^ARUS KAS UNTUK AKTIVITAS PENDANAAN/i),nk=find(/^KENAIKAN/i),pl=find(/^Penerimaan dari Pelanggan/i);
 const g=r=>cols.map(c=>r?(r[c]||0)/1e9:0),Lc=cols[cols.length-1];
 PO.push(()=>bar('c1',cols.map((c,i)=>M[i]),[['Operasi',g(ops)],['Investasi',g(inv)],['Pendanaan',g(fin)],['Kas akhir',g(kas)]],{line:3}));

 const side=(li,vi)=>{let h='';R.slice(hi+1).forEach(r=>{const l=T(r,li);if(!l)return;const v=[r[vi],r[vi+1],r[vi+2],r[vi+3]];if(!v.some(isN)){h+=`<tr class="hd"><td colspan="5">${esc(l)}</td></tr>`;return}
